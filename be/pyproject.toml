[project]
name = "be"
version = "0.1.0"
description = "FastAPI backend for Spit.sh URL shortener"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.19.0",
    "alembic>=1.13,<2",
    "asyncpg==0.30.0",
    "fastapi>=0.115,<1",
    "geoip2==5.2.0",
    "greenlet>=3.5.0",
    "gunicorn>=25.3.0",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.9",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "resend>=2.29.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0,<2.1",
    "sqlmodel>=0.0.22",
    "user-agents>=2.2.0",
    "uvicorn>=0.46.0",
]
